version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # A new Car App Library version changes the host API our template rendering implements
      # (1.9.0-alpha03 broke the build): move to a new minor version deliberately, by hand.
      # Fixes within the current one (1.8.x) still come through.
      - dependency-name: "androidx.car.app:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
