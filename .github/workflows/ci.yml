# Builds everything and runs the tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests, app unit tests, debug APK, desktop head unit
        run: ./gradlew --no-daemon :aap:test :app:testDebugUnitTest :app:assembleDebug :headunit:installDist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: aare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
